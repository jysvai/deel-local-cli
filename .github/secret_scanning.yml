# 비밀 훑기에서 **검사 말뭉치**를 뺀다.
#
# test/fixtures/ 의 말뭉치는 비밀 가리기 무늬가 무엇을 잡고 무엇을 안 잡는지
# 재려고 **일부러 지어낸 열쇠 모양**을 줄줄이 적어 둔 파일이다. 진짜 열쇠는
# 한 줄도 없다 — 하나하나가 자리표시자다(예: AIza + 0‑9 다음 a‑v 를 순서대로).
#
# 그런데 모양이 진짜와 같아야 무늬를 잴 수 있으니, 깃허브 비밀 훑기가 매번
# 그것을 잡는다. 잡힌 것을 하나씩 닫아도 말뭉치에 한 줄을 더하는 날 또 뜬다.
# 그러면 **진짜 경고가 가짜 경고 사이에 묻힌다** — 거짓 경고는 진짜 경고를
# 죽인다는 이 저장소의 잣대 그대로다.
#
# 그래서 이 자리만 뺀다. 나머지 경로는 전부 그대로 훑는다.
paths-ignore:
  - 'test/fixtures/**'
