name: publish

# ── 왜 손으로 안 올리나 ─────────────────────────────────────────────────
#
# 이 프로그램이 파는 것은 "내 소스가 어디로도 안 간다" 는 믿음이다. 그런데
# 정작 npm 에 올라간 물건이 그 소스에서 나왔다는 것은 지금까지 **내 말뿐**
# 이었다. 받는 사람 입장에서는 확인할 방법이 없다.
#
# npm provenance 는 그 자리를 메운다. GitHub Actions 가 빌드하면서 "이 판은
# 이 저장소의 이 커밋에서, 이 워크플로로 나왔다" 는 서명을 붙이고, 공개
# 투명성 로그(Sigstore)에 남긴다. npm 페이지에 커밋 해시까지 뜬다.
# 사내 심사에서 "받은 tarball 이 공개된 그 소스가 맞나" 를 물으면, 이제
# 말이 아니라 링크로 답한다.
#
# ── 올리는 법 ───────────────────────────────────────────────────────────
#
#   1. npm 에서 토큰을 하나 만든다 (Automation 형. 2FA 를 안 묻는 형이라
#      CI 에서 쓸 수 있다. 사람이 손으로 올릴 때는 지금처럼 OTP 를 묻는다).
#   2. 이 저장소 Settings → Secrets and variables → Actions 에
#      `NPM_TOKEN` 으로 넣는다.
#   3. package.json 의 판을 올리고 커밋한 뒤 태그를 민다.
#
#        git tag v1.4.0 && git push origin v1.4.0
#
#      태그를 밀면 검사가 다 돌고, 통과해야 올라간다.
#
# ── 이 워크플로는 **한 번도 성공한 적이 없었다** ────────────────────────
#
# v1.5.8 부터 v1.12.0 까지 열두 판이 전부 빨갛게 끝났다. 그런데 npm 에는 그
# 판들이 있다 — 손으로 올렸기 때문이다. 그러니 「올라갔으니 됐겠지」 였고,
# 빨간 것을 아무도 안 열어 봤다. 열어 보니 마지막 줄이 늘 같았다.
#
#   npm error code ENEEDAUTH
#   npm error need auth This command requires you to be logged in
#
# 아래 publish 단계가 쓰는 `secrets.NPM_TOKEN` 이 **이 저장소에 없다.** 없는
# 시크릿은 빈 글자로 들어오고, 빈 열쇠는 「안 넣은 것」 과 같다. 위 머리말이
# 「토큰을 만들어 넣어라」 라고 세 줄로 적어 두었는데 그 단계를 안 밟았고,
# 안 밟았다는 것을 말해 주는 자리가 아무 데도 없었다.
#
# 올리는 길은 둘이다. 하나를 골라 두면 그 뒤로는 태그만 밀면 된다.
#
#   가. 믿는 발행자 (trusted publishing · OIDC)  ← 권함
#      npmjs.com 의 그 패키지 Settings 에서 이 저장소와 이 워크플로 파일
#      이름을 등록한다. 그러면 **저장할 비밀이 아예 없다** — 워크플로가
#      그 자리에서 받은 짧은 신분증으로 올린다. 훔칠 토큰도, 돌릴 토큰도
#      없다. provenance 도 자동으로 붙는다.
#      npm 11.5.1 · Node 22.14 위여야 한다 (아래 setup-node 가 그렇게 맞춘다).
#
#      **이 길을 고르면 NPM_TOKEN 시크릿을 지운다.** 토큰이 있으면 아래
#      setup-node 가 그걸 .npmrc 에 적고, npm 은 OIDC 로 안 간다.
#      둘을 같이 두면 「믿는 발행자를 켰는데 왜 여전히 토큰으로 가나」 를
#      알아낼 방법이 없다.
#
#   나. 토큰 (급할 때)
#      **Granular** 토큰이어야 하고, 두 가지가 같이 켜져 있어야 한다.
#
#        · Packages and scopes → deel-local-cli → **Read and write**
#        · **Bypass 2FA** 켜기
#
#      npm 은 모든 패키지의 발행에 2FA 를 요구한다. 토큰으로 올리려면 그
#      토큰이 2FA 를 건너뛸 수 있어야 한다는 뜻이다. 둘 중 하나라도 없으면
#      인증은 되는데 쓰기에서 막힌다 — 401 이 아니라 **403** 이 온다.
#
#        npm error 403 Forbidden - PUT https://registry.npmjs.org/…
#        You may not perform that action with these credentials.
#
#      401 은 「누구냐」 이고 403 은 「너인 건 알겠는데 그건 못 한다」 이다.
#      글자가 비슷해서 같은 것으로 읽기 쉬운데, 고칠 자리가 서로 다르다.
#
#      그리고 npm 이 이 우회 자체를 걷어내는 중이다. 올릴 때마다 그렇게
#      적어 준다 —
#
#        npm notice npm tokens that bypass 2FA are being restricted
#
#      그러니 이 길은 임시로 두고, 가. 로 옮기는 편이 낫다.
#
# 어느 쪽도 안 해 두면 아래 publish 단계가 **왜 못 올리는지 적고 멈춘다.**
# 20분짜리 검사를 다 돌리고 마지막 줄에서 ENEEDAUTH 를 보는 것보다,
# 시작하자마자 「무엇을 해야 하는지」 를 읽는 편이 낫다.
#
# ── 태그 없이 올리지 않는다 ─────────────────────────────────────────────
#
# 손으로 돌리는 길(workflow_dispatch)에서는 「태그와 판이 같은가」 를 보는
# 단계가 **안 돌게** 되어 있었다 — 그 단계는 `push` 일 때만 돌았다. 그러면
# 태그가 안 달린 커밋도 그대로 올라간다.
#
# 태그가 없으면 `git checkout v1.12.0` 이 안 된다. 이 프로그램이 파는 문장이
# 「올라간 물건이 이 소스에서 나왔다」 인데, 그 소스를 짚을 이름이 없으면
# 절반만 지킨 셈이다. 그래서 손으로 돌릴 때도 **태그를 요구한다.**

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # 서명에 쓰는 짧은 수명의 신분증을 받는 권한. 이것이 없으면
      # --provenance 가 조용히 실패하는 것이 아니라 아예 거절된다.
      id-token: write
    steps:
      # 액션도 판이 있다. v4 는 Node 20 위에서 도는데 러너가 그걸 이제 안 쓴다
      # ("forced to run on Node.js 24"). 매 판 경고가 붙고, 언젠가는 경고가
      # 아니라 고장이 된다. 그리고 믿는 발행자(OIDC)는 새 판에서만 된다.
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          # 믿는 발행자는 npm 11.5.1 · Node 22.14 위를 요구한다. 24 로 두면
          # 둘 다 넉넉히 넘는다. 검사는 test.yml 이 20·22·24 에서 따로 돈다 —
          # 여기서 고른 판은 **올리는 데 쓰는 판**이지 재는 판이 아니다.
          node-version: 24
          registry-url: 'https://registry.npmjs.org'
          # 캐시는 안 건다 (기본값이 그렇다). 캐시에서 나온 것이 소스에서 나온
          # 것과 같다는 보장이 없고, 이 판이 파는 것이 바로 그 보장이다.

      # 태그와 package.json 이 어긋난 채로 올라가면 되돌릴 수가 없다
      # (npm 은 같은 판을 다시 못 올린다). 그래서 여기서 먼저 막는다.
      #
      # 셸 변수 이름은 ASCII 여야 한다. 처음에 한글 이름(판·태그)을 썼다가
      # "command not found"(exit 127)로 이 단계 자체가 안 돌았다 — bash 는
      # 로케일과 무관하게 변수 이름에 [a-zA-Z_][a-zA-Z0-9_]* 만 받는다.
      # 이 프로그램의 house style(식별자는 한글)이 통하는 것은 JS 뿐이고,
      # 셸에서는 안 통한다.
      # 태그를 받으려면 히스토리가 있어야 한다. checkout 은 기본이 depth 1 이라
      # 태그가 안 딸려 온다 — 아래 확인이 늘 「태그가 없다」 로 떨어진다.
      - name: fetch tags
        run: git fetch --tags --force --depth=1

      - name: tag matches package.json
        shell: bash
        run: |
          pkg_version=$(node -p "require('./package.json').version")
          tag_version="${GITHUB_REF_NAME#v}"

          # 태그를 밀어서 온 길: 태그 이름과 판이 같아야 한다.
          # 어긋난 채로 올라가면 되돌릴 수가 없다 — npm 은 같은 판을 다시 못 올린다.
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            if [ "$pkg_version" != "$tag_version" ]; then
              echo "태그 v$tag_version 와 package.json $pkg_version 이 다릅니다." >&2
              exit 1
            fi
            echo "$pkg_version (태그 v$tag_version)"
            exit 0
          fi

          # 손으로 돌린 길: 이 커밋에 v<판> 태그가 **붙어 있어야** 한다.
          # 이게 없어서 1.10.0·1.12.0 이 태그 없이 나갔다 (위 머리말).
          want="v$pkg_version"
          if ! git rev-parse -q --verify "refs/tags/$want" >/dev/null; then
            echo "태그 $want 가 없습니다. 올리기 전에 만들어 미세요:" >&2
            echo "  git tag $want && git push origin $want" >&2
            exit 1
          fi
          at=$(git rev-list -n 1 "$want")
          if [ "$at" != "$GITHUB_SHA" ]; then
            echo "태그 $want 는 $at 를 가리키는데 지금 올리려는 것은 $GITHUB_SHA 입니다." >&2
            echo "다른 커밋을 올리려면 그 커밋에 태그를 다시 붙이세요." >&2
            exit 1
          fi
          echo "$pkg_version (태그 $want → $at)"

      # ── 이미 올라가 있으면 올리지 않는다 ──────────────────────────────
      #
      # 태그 하나가 워크플로 하나다. 그래서 **뒤늦게 붙이는 태그**도 이 길을
      # 지난다 — v1.10.0·v1.12.0 처럼 npm 에는 이미 있고 태그만 안 밀렸던 판.
      #
      # 그대로 두면 마지막 단계에서 npm 이 403 을 준다(같은 판은 두 번 못
      # 올린다). 워크플로는 빨갛게 끝나고, 그 빨강은 **고칠 것이 없는 빨강**
      # 이다. 그런 빨강이 목록에 쌓이면 진짜 빨강도 안 보게 된다.
      #
      # 그래서 먼저 물어보고, 이미 있으면 여기까지만 하고 곱게 끝낸다.
      # 「올렸다」 와 「이미 있어서 안 올렸다」 는 로그에 다르게 적는다.
      - name: already on npm?
        # id·출력 이름은 ASCII 로 둔다. 이 파일 머리말에 적힌 그 이유다 —
        # 한글 식별자가 통하는 것은 JS 뿐이고, 셸과 액션 표현식에서는 안 통한다.
        id: onnpm
        shell: bash
        run: |
          name=$(node -p "require('./package.json').name")
          ver=$(node -p "require('./package.json').version")
          if npm view "$name@$ver" version >/dev/null 2>&1; then
            echo "found=yes" >> "$GITHUB_OUTPUT"
            echo "$name@$ver 는 이미 npm 에 있습니다 — 올리지 않고 끝냅니다."
          else
            echo "found=no" >> "$GITHUB_OUTPUT"
            echo "$name@$ver 는 아직 없습니다 — 검사를 돌리고 올립니다."
          fi

      # ── 올릴 길이 있나 ────────────────────────────────────────────────
      #
      # **검사보다 먼저 본다.** 이 자리가 검사 뒤에 있으면 아무 뜻이 없다 —
      # 어차피 20분을 다 쓰고 나서 멈추는 것이고, 그건 예전에 마지막 줄에서
      # ENEEDAUTH 를 만나던 것과 사람이 겪는 바가 같다. 열두 판이 그렇게
      # 빨갰고, 그 글자만 봐서는 무엇을 해야 하는지 알 수가 없었다.
      #
      # 「먼저 멈춘다」 고 적어 놓고 뒤에 세워 두면 그 주석이 거짓이 된다.
      # 이 저장소가 코드에 대고 하는 말과 같은 잣대를 워크플로에도 댄다.
      - name: can we publish?
        if: steps.onnpm.outputs.found == 'no'
        shell: bash
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -n "$NPM_TOKEN" ]; then
            echo "토큰으로 올립니다 (NPM_TOKEN)."
            # 토큰이 **있다**는 것과 그 토큰이 **올릴 수 있다**는 것은 다르다.
            # 여기서 미리 물어볼 방법이 없어서(권한은 PUT 을 해 봐야 안다),
            # 대신 막혔을 때 무엇을 봐야 하는지를 지금 적어 둔다.
            echo "  403 이 오면 토큰 권한 문제입니다 — Read and write 와" >&2
            echo "  Bypass 2FA 를 둘 다 켜야 합니다 (이 파일 머리말 참고)." >&2
            exit 0
          fi
          if [ -n "$ACTIONS_ID_TOKEN_REQUEST_URL" ]; then
            echo "믿는 발행자(OIDC)로 올려 봅니다 — npmjs.com 쪽에 이 저장소가"
            echo "등록되어 있어야 합니다. 안 되어 있으면 다음 단계에서 튕깁니다."
            exit 0
          fi
          echo "올릴 길이 없습니다. 둘 중 하나를 해 두세요:" >&2
          echo "  가. npmjs.com 의 이 패키지 Settings 에서 믿는 발행자로" >&2
          echo "      이 저장소와 이 워크플로를 등록한다 (저장할 비밀이 없습니다)" >&2
          echo "  나. Granular 토큰을 만들어 NPM_TOKEN 으로 넣는다." >&2
          echo "      그 토큰에 Read and write 와 Bypass 2FA 가 둘 다 있어야" >&2
          echo "      한다 — 없으면 인증은 되고 쓰기에서 403 이 온다." >&2
          exit 1

      # 이미 올라간 판이면 검사도 안 돌린다. 그 커밋의 검사는 그때 이미 돌았고,
      # 지금 코드가 아닌 옛 코드를 다시 재는 것은 아무에게도 안 쓰인다.
      - name: syntax
        if: steps.onnpm.outputs.found == 'no'
        run: npm run check
      - name: test
        if: steps.onnpm.outputs.found == 'no'
        run: npm test

      - name: publish
        if: steps.onnpm.outputs.found == 'no'
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
