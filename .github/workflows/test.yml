name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [20, 22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
      # 의존성이 0개라 설치 단계가 없다. 그것 자체를 확인한다.
      #
      # run 값은 반드시 블록 스칼라(|)로 쓴다. 한 줄로 쓰면 명령 안의
      # 콜론+공백을 YAML 이 키 구분자로 읽어 워크플로 전체가 파싱에 실패한다.
      # 그러면 작업이 하나도 안 돌고 실행이 0초 만에 실패로 끝난다.
      # 윈도우 러너의 기본 셸은 PowerShell 이다. 여러 줄 따옴표를 셸마다
      # 다르게 읽으므로 이 단계만 bash 로 못을 박는다.
      - name: no dependencies
        shell: bash
        run: |
          node -e "
            const p = require('./package.json');
            const n = Object.keys({ ...p.dependencies, ...p.devDependencies });
            if (n.length) { console.error('의존성이 생겼습니다:', n.join(', ')); process.exit(1); }
            console.log('dependencies 0 - OK');
          "
      - name: syntax
        run: npm run check
      - name: test
        run: npm test
      # README 를 나눈 뒤로 링크가 파일 경계를 넘는다. 끊어져도 아무 데도 안
      # 찍히고 읽는 사람만 막다른 길에 서므로, 여기서 잡는다. 한 번만 돌면 된다.
      - name: docs links
        if: matrix.os == 'ubuntu-latest' && matrix.node == 22
        run: npm run docs
