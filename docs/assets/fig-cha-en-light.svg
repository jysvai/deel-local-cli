    <text x="558.0" y="272.0" fill="#1f2328" font-size="12" font-weight="600" textLength="64.8" lengthAdjust="spacing" xml:space="preserve">②  Gemini</text>
    <text x="558.0" y="287.0" fill="#59636e" font-size="10" textLength="276.0" lengthAdjust="spacing" xml:space="preserve">reads only · every claim settled by running it</text>
    <text x="558.0" y="318.0" fill="#1f2328" font-size="12" font-weight="600" textLength="57.6" lengthAdjust="spacing" xml:space="preserve">③  codex</text>
    <text x="558.0" y="333.0" fill="#59636e" font-size="10" textLength="270.0" lengthAdjust="spacing" xml:space="preserve">reads only · a third pass over the same place</text>
