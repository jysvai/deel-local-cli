    <text x="542.0" y="374.0" fill="#59636e" font-size="10.5" textLength="359.1" lengthAdjust="spacing" xml:space="preserve">One lap is one round. 2.0.0 went around it fifteen times.</text>
    <text x="542.0" y="391.0" fill="#59636e" font-size="10.5" textLength="327.6" lengthAdjust="spacing" xml:space="preserve">A &quot;false&quot; verdict at step 4 is written down with its</text>
    <text x="542.0" y="408.0" fill="#59636e" font-size="10.5" textLength="258.3" lengthAdjust="spacing" xml:space="preserve">counter-evidence, and nothing is changed.</text>
    <text x="542.0" y="425.0" fill="#59636e" font-size="10.5" textLength="340.2" lengthAdjust="spacing" xml:space="preserve">If the test stays green at step 7, go back to step 6 —</text>
    <text x="542.0" y="442.0" fill="#59636e" font-size="10.5" textLength="352.8" lengthAdjust="spacing" xml:space="preserve">green can mean &quot;guarded&quot; or just &quot;not caught this time&quot;.</text>
