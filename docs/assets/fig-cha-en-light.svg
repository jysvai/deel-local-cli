<svg xmlns="http://www.w3.org/2000/svg" width="930" height="522" viewBox="0 0 930 522" role="img" aria-label="deel — CHA — the nine steps of one round">
  <title>deel — CHA — the nine steps of one round</title>
  <desc>The nine steps of Cyclic Hostile Harnessing (CHA) are laid out as a ring, and a marker walks them one at a time, over and over: hunt, brief, second eyes, adjudicate, red test first, fix, mutate, gate, record — and step 9 returns to step 1. Three models stand at the second-eyes step: Claude writes, Gemini and codex only read. With reduced motion it falls back to a still frame on the first step.</desc>
  <style>
      .선것 { display: none }
      @media (prefers-reduced-motion: reduce) {
        .도는것 { display: none }
        .선것 { display: inline }
      }
    </style>
