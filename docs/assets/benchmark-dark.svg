<text x="28" y="582" fill="#8b949e" font-size="11.5">표본 2회. Claude 쪽에는 외부 절감 패키지(claude-token-saver)가 붙어 있어 CLI 자체 효율만 분리한 값이 아닙니다.</text>
<text x="28" y="600" fill="#8b949e" font-size="11.5">전체 회귀 범위는 Claude가 넓었습니다. 「deel이 일반적으로 더 싸다」 고는 이 자료로 말할 수 없습니다.</text>
