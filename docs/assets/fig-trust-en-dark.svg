<svg xmlns="http://www.w3.org/2000/svg" width="900" height="626" viewBox="0 0 900 626" role="img" aria-label="deel — Where your text can go">
  <title>deel — Where your text can go</title>
  <desc>Your working folder and .deel/ live on this machine, and only four paths cross the line: the model gateway, WebFetch, plugin downloads and MCP servers. The key, the audit log, the undo history and your conversations never cross, and nothing is collected. Sealed mode (deel offline) locks the last three and keeps the model address on this machine or the intranet.</desc>
  <rect width="900" height="626" rx="10" fill="#0d1117" stroke="#30363d"/>
  <g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace">
    <text x="36.0" y="36.0" fill="#e6edf3" font-size="16" font-weight="600" textLength="211.2" lengthAdjust="spacing" xml:space="preserve">Where your text can go</text>
    <text x="36.0" y="58.0" fill="#8b949e" font-size="11.5" textLength="524.4" lengthAdjust="spacing" xml:space="preserve">Inside this machine and outside — what crosses the line, and what never does</text>
    <rect x="36.0" y="80.0" width="828.0" height="192.0" rx="9" fill="#3fb950" fill-opacity="0.06" stroke="#3fb950" stroke-width="1.4"/>
    <text x="54.0" y="104.0" fill="#3fb950" font-size="13" font-weight="600" textLength="366.6" lengthAdjust="spacing" xml:space="preserve">⌂  Inside this machine — your folder and .deel/</text>
    <text x="54.0" y="130.0" fill="#8b949e" font-size="11" textLength="99.0" lengthAdjust="spacing" xml:space="preserve">What lives here</text>
    <text x="54.0" y="152.0" fill="#e6edf3" font-size="11.5" textLength="227.7" lengthAdjust="spacing" xml:space="preserve">the source in your working folder</text>
    <text x="54.0" y="172.0" fill="#e6edf3" font-size="11.5" textLength="207.0" lengthAdjust="spacing" xml:space="preserve">.deel/sessions — conversations</text>
    <text x="54.0" y="192.0" fill="#e6edf3" font-size="11.5" textLength="207.0" lengthAdjust="spacing" xml:space="preserve">.deel/history — undo snapshots</text>
    <text x="54.0" y="212.0" fill="#e6edf3" font-size="11.5" textLength="227.7" lengthAdjust="spacing" xml:space="preserve">.deel/audit.jsonl — the audit log</text>
    <text x="54.0" y="232.0" fill="#e6edf3" font-size="11.5" textLength="165.6" lengthAdjust="spacing" xml:space="preserve">.deel/memory.md — memory</text>
    <text x="54.0" y="252.0" fill="#e6edf3" font-size="11.5" textLength="276.0" lengthAdjust="spacing" xml:space="preserve">config.json — the key (DPAPI · Keychain)</text>
    <text x="470.0" y="130.0" fill="#ff7b72" font-size="11" font-weight="600" textLength="204.6" lengthAdjust="spacing" xml:space="preserve">⊘  What never crosses this line</text>
    <text x="470.0" y="156.0" fill="#e6edf3" font-size="11.5" textLength="365.7" lengthAdjust="spacing" xml:space="preserve">the key — auth to that address only; masked elsewhere</text>
    <text x="470.0" y="178.0" fill="#e6edf3" font-size="11.5" textLength="338.1" lengthAdjust="spacing" xml:space="preserve">audit log · undo history · chats — in .deel/ only</text>
    <text x="470.0" y="200.0" fill="#e6edf3" font-size="11.5" textLength="317.4" lengthAdjust="spacing" xml:space="preserve">telemetry · usage stats · crash reports — none</text>
    <line x1="135.0" y1="284.0" x2="135.0" y2="391.0" stroke="#58a6ff" stroke-width="1.6" stroke-linecap="round"/><path d="M135.0 400.0 L130.6 391.0 L139.4 391.0 Z" fill="#58a6ff"/>
    <circle cx="135.0" cy="334" r="11" fill="#0d1117" stroke="#3fb950" stroke-width="1.6"/>
    <text x="131.7" y="338.0" fill="#3fb950" font-size="11" textLength="6.6" lengthAdjust="spacing" xml:space="preserve">⌂</text>
    <rect x="36.0" y="408.0" width="198.0" height="118.0" rx="9" fill="#161b22" stroke="#30363d" stroke-width="1.4"/>
    <text x="50.0" y="430.0" fill="#58a6ff" font-size="12" font-weight="600" textLength="21.6" lengthAdjust="spacing" xml:space="preserve">[A]</text>
    <text x="80.0" y="430.0" fill="#e6edf3" font-size="12" font-weight="600" textLength="93.6" lengthAdjust="spacing" xml:space="preserve">Model gateway</text>
    <text x="50.0" y="454.0" fill="#8b949e" font-size="10.5" textLength="107.1" lengthAdjust="spacing" xml:space="preserve">your words · file</text>
    <text x="50.0" y="471.0" fill="#8b949e" font-size="10.5" textLength="113.4" lengthAdjust="spacing" xml:space="preserve">excerpts · results</text>
    <text x="50.0" y="488.0" fill="#8b949e" font-size="10.5" textLength="144.9" lengthAdjust="spacing" xml:space="preserve">one address, from setup</text>
    <line x1="345.0" y1="284.0" x2="345.0" y2="391.0" stroke="#58a6ff" stroke-width="1.6" stroke-linecap="round"/><path d="M345.0 400.0 L340.6 391.0 L349.4 391.0 Z" fill="#58a6ff"/>
    <circle cx="345.0" cy="334" r="11" fill="#0d1117" stroke="#ff7b72" stroke-width="1.6"/>
    <text x="341.7" y="338.0" fill="#ff7b72" font-size="11" textLength="6.6" lengthAdjust="spacing" xml:space="preserve">⛊</text>
    <rect x="246.0" y="408.0" width="198.0" height="118.0" rx="9" fill="#161b22" stroke="#30363d" stroke-width="1.4"/>
    <text x="260.0" y="430.0" fill="#58a6ff" font-size="12" font-weight="600" textLength="21.6" lengthAdjust="spacing" xml:space="preserve">[B]</text>
    <text x="290.0" y="430.0" fill="#e6edf3" font-size="12" font-weight="600" textLength="57.6" lengthAdjust="spacing" xml:space="preserve">WebFetch</text>
    <text x="260.0" y="454.0" fill="#8b949e" font-size="10.5" textLength="113.4" lengthAdjust="spacing" xml:space="preserve">receive only — GET</text>
    <text x="260.0" y="471.0" fill="#8b949e" font-size="10.5" textLength="88.2" lengthAdjust="spacing" xml:space="preserve">zero-byte body</text>
    <text x="260.0" y="488.0" fill="#8b949e" font-size="10.5" textLength="163.8" lengthAdjust="spacing" xml:space="preserve">private · loopback refused</text>
    <line x1="555.0" y1="284.0" x2="555.0" y2="391.0" stroke="#58a6ff" stroke-width="1.6" stroke-linecap="round"/><path d="M555.0 400.0 L550.6 391.0 L559.4 391.0 Z" fill="#58a6ff"/>
    <circle cx="555.0" cy="334" r="11" fill="#0d1117" stroke="#ff7b72" stroke-width="1.6"/>
    <text x="551.7" y="338.0" fill="#ff7b72" font-size="11" textLength="6.6" lengthAdjust="spacing" xml:space="preserve">⛊</text>
    <rect x="456.0" y="408.0" width="198.0" height="118.0" rx="9" fill="#161b22" stroke="#30363d" stroke-width="1.4"/>
    <text x="470.0" y="430.0" fill="#58a6ff" font-size="12" font-weight="600" textLength="21.6" lengthAdjust="spacing" xml:space="preserve">[C]</text>
    <text x="500.0" y="430.0" fill="#e6edf3" font-size="12" font-weight="600" textLength="108.0" lengthAdjust="spacing" xml:space="preserve">Plugin download</text>
    <text x="470.0" y="454.0" fill="#8b949e" font-size="10.5" textLength="63.0" lengthAdjust="spacing" xml:space="preserve">only while</text>
    <text x="470.0" y="471.0" fill="#8b949e" font-size="10.5" textLength="126.0" lengthAdjust="spacing" xml:space="preserve">/plugin install runs</text>
    <line x1="765.0" y1="284.0" x2="765.0" y2="391.0" stroke="#58a6ff" stroke-width="1.6" stroke-linecap="round"/><path d="M765.0 400.0 L760.6 391.0 L769.4 391.0 Z" fill="#58a6ff"/>
    <circle cx="765.0" cy="334" r="11" fill="#0d1117" stroke="#ff7b72" stroke-width="1.6"/>
    <text x="761.7" y="338.0" fill="#ff7b72" font-size="11" textLength="6.6" lengthAdjust="spacing" xml:space="preserve">⛊</text>
    <rect x="666.0" y="408.0" width="198.0" height="118.0" rx="9" fill="#161b22" stroke="#30363d" stroke-width="1.4"/>
    <text x="680.0" y="430.0" fill="#58a6ff" font-size="12" font-weight="600" textLength="21.6" lengthAdjust="spacing" xml:space="preserve">[D]</text>
    <text x="710.0" y="430.0" fill="#e6edf3" font-size="12" font-weight="600" textLength="79.2" lengthAdjust="spacing" xml:space="preserve">MCP servers</text>
    <text x="680.0" y="454.0" fill="#8b949e" font-size="10.5" textLength="138.6" lengthAdjust="spacing" xml:space="preserve">someone else's process</text>
    <text x="680.0" y="471.0" fill="#8b949e" font-size="10.5" textLength="126.0" lengthAdjust="spacing" xml:space="preserve">we cannot see inside</text>
    <text x="680.0" y="488.0" fill="#8b949e" font-size="10.5" textLength="144.9" lengthAdjust="spacing" xml:space="preserve">a human writes mcp.json</text>
    <line x1="36" y1="334" x2="864" y2="334" stroke="#3fb950" stroke-width="2.5" stroke-linecap="round"/>
    <text x="36.0" y="324.0" fill="#3fb950" font-size="10.5" textLength="277.2" lengthAdjust="spacing" xml:space="preserve">the line — this machine above, outside below</text>
    <rect x="36.0" y="544.0" width="828.0" height="58.0" rx="9" fill="#ff7b72" fill-opacity="0.06" stroke="#ff7b72" stroke-width="1.4" stroke-dasharray="5 4"/>
    <text x="54.0" y="566.0" fill="#e6edf3" font-size="11.5" font-weight="600" textLength="607.2" lengthAdjust="spacing" xml:space="preserve">⛊  Sealed (deel offline) — B, C and D are locked. An MCP server is never started at all.</text>
    <text x="54.0" y="586.0" fill="#8b949e" font-size="11.5" textLength="738.3" lengthAdjust="spacing" xml:space="preserve">A stays on this machine or the intranet (127.x · 10.x · 192.168.x · 172.16-31.x). ⌂ asks first; ↗ does not.</text>
  </g>
</svg>
