  <text x="428" y="22" fill="#59636e" font-size="12" text-anchor="middle" font-family="ui-sans-serif,-apple-system,Segoe UI,sans-serif">deel</text>
  <g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="14">
    <text x="16.0" y="64" fill="#1f2328" textLength="823.2" lengthAdjust="spacing" xml:space="preserve">  ╭──────────────────────────────────────────────────────────────────────────────────────────────╮</text>
    <text x="16.0" y="83" fill="#1f2328" textLength="823.2" lengthAdjust="spacing" xml:space="preserve">  │ deel 1.7.0  ⌂ inside (default)  OpenAI-compatible API                                        │</text>
