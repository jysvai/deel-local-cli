    <text x="16.0" y="140" fill="#1f2328" textLength="823.2" lengthAdjust="spacing" xml:space="preserve">  │ sends to  this machine 127.0.0.1:58877  ← and nowhere else                                   │</text>
    <text x="16.0" y="159" fill="#1f2328" textLength="823.2" lengthAdjust="spacing" xml:space="preserve">  │           The ⌂ at the start of the status bar means this. It becomes ↗ when traffic leaves. │</text>
