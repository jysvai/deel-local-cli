<svg xmlns="http://www.w3.org/2000/svg" width="930" height="752" viewBox="0 0 930 752" role="img" aria-label="deel — How one message travels">
  <title>deel — How one message travels</title>
  <desc>Routing picks a mode from what you typed, and only the tools that mode allows reach the list sent to the model. A tool call has to pass the mode gate and the approval gate; if it is caught, it stops there. Results go back to the model and repeat up to the step ceiling, and Verify checks the work before the answer.</desc>
  <rect width="930" height="752" rx="10" fill="#ffffff" stroke="#d0d7de"/>
  <g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace">
    <text x="44.0" y="36.0" fill="#1f2328" font-size="16" font-weight="600" textLength="220.8" lengthAdjust="spacing" xml:space="preserve">How one message travels</text>
    <text x="44.0" y="58.0" fill="#59636e" font-size="11.5" textLength="427.8" lengthAdjust="spacing" xml:space="preserve">From the line you type to the answer — and where the gates are</text>
    <rect x="44.0" y="88.0" width="380.0" height="56.0" rx="9" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.4"/>
    <text x="58.0" y="122.0" fill="#0969da" font-size="15" font-weight="600" textLength="9.0" lengthAdjust="spacing" xml:space="preserve">❯</text>
    <text x="86.0" y="112.0" fill="#1f2328" font-size="12.5" font-weight="600" textLength="97.5" lengthAdjust="spacing" xml:space="preserve">What you type</text>
    <text x="86.0" y="130.0" fill="#59636e" font-size="11" textLength="211.2" lengthAdjust="spacing" xml:space="preserve">&quot;switch the logs over to logger&quot;</text>
    <line x1="234.0" y1="146.0" x2="234.0" y2="152.0" stroke="#59636e" stroke-width="1.5" stroke-linecap="round"/><path d="M234.0 161.0 L229.6 152.0 L238.4 152.0 Z" fill="#59636e"/>
    <rect x="44.0" y="164.0" width="380.0" height="56.0" rx="9" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.4"/>
    <text x="58.0" y="198.0" fill="#8250df" font-size="15" font-weight="600" textLength="9.0" lengthAdjust="spacing" xml:space="preserve">⇄</text>
    <text x="86.0" y="188.0" fill="#1f2328" font-size="12.5" font-weight="600" textLength="52.5" lengthAdjust="spacing" xml:space="preserve">Routing</text>
    <text x="86.0" y="206.0" fill="#59636e" font-size="11" textLength="198.0" lengthAdjust="spacing" xml:space="preserve">picks the mode from your words</text>
    <line x1="234.0" y1="222.0" x2="234.0" y2="228.0" stroke="#59636e" stroke-width="1.5" stroke-linecap="round"/><path d="M234.0 237.0 L229.6 228.0 L238.4 228.0 Z" fill="#59636e"/>
    <text x="456.0" y="180.0" fill="#59636e" font-size="11" textLength="363.0" lengthAdjust="spacing" xml:space="preserve">Pick a mode yourself with /code and auto-routing stops.</text>
    <text x="456.0" y="195.0" fill="#59636e" font-size="11" textLength="270.6" lengthAdjust="spacing" xml:space="preserve">It does not overrule what a person chose.</text>
    <rect x="44.0" y="240.0" width="380.0" height="56.0" rx="9" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.4"/>
    <text x="58.0" y="274.0" fill="#0969da" font-size="15" font-weight="600" textLength="9.0" lengthAdjust="spacing" xml:space="preserve">◆</text>
    <text x="86.0" y="264.0" fill="#1f2328" font-size="12.5" font-weight="600" textLength="150.0" lengthAdjust="spacing" xml:space="preserve">Mode — the tool list</text>
    <text x="86.0" y="282.0" fill="#59636e" font-size="11" textLength="297.0" lengthAdjust="spacing" xml:space="preserve">Code ◆ · read · plan · write · verify · split</text>
    <line x1="234.0" y1="298.0" x2="234.0" y2="304.0" stroke="#59636e" stroke-width="1.5" stroke-linecap="round"/><path d="M234.0 313.0 L229.6 304.0 L238.4 304.0 Z" fill="#59636e"/>
    <text x="456.0" y="256.0" fill="#59636e" font-size="11" textLength="323.4" lengthAdjust="spacing" xml:space="preserve">Tools the mode lacks never reach the list at all.</text>
    <text x="456.0" y="271.0" fill="#59636e" font-size="11" textLength="316.8" lengthAdjust="spacing" xml:space="preserve">It is a list, not a request — nothing to forget.</text>
    <rect x="44.0" y="316.0" width="380.0" height="56.0" rx="9" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.4"/>
    <text x="58.0" y="350.0" fill="#1b7c83" font-size="15" font-weight="600" textLength="9.0" lengthAdjust="spacing" xml:space="preserve">◍</text>
    <text x="86.0" y="340.0" fill="#1f2328" font-size="12.5" font-weight="600" textLength="37.5" lengthAdjust="spacing" xml:space="preserve">Model</text>
    <text x="86.0" y="358.0" fill="#59636e" font-size="11" textLength="237.6" lengthAdjust="spacing" xml:space="preserve">this machine, or one company gateway</text>
    <line x1="234.0" y1="374.0" x2="234.0" y2="380.0" stroke="#59636e" stroke-width="1.5" stroke-linecap="round"/><path d="M234.0 389.0 L229.6 380.0 L238.4 380.0 Z" fill="#59636e"/>
    <text x="456.0" y="332.0" fill="#59636e" font-size="11" textLength="382.8" lengthAdjust="spacing" xml:space="preserve">The address it sends to is printed at the top (⌂ · ↗ · ⛊).</text>
    <rect x="44.0" y="392.0" width="380.0" height="40.0" rx="8" fill="#9a6700" fill-opacity="0.1" stroke="#9a6700" stroke-width="1.4"/>
    <text x="58.0" y="417.0" fill="#9a6700" font-size="13" font-weight="600" textLength="7.8" lengthAdjust="spacing" xml:space="preserve">①</text>
    <text x="80.0" y="417.0" fill="#1f2328" font-size="12" textLength="223.2" lengthAdjust="spacing" xml:space="preserve">Mode gate · a tool off the list</text>
    <text x="352.6" y="417.0" fill="#cf222e" font-size="11" textLength="59.4" lengthAdjust="spacing" xml:space="preserve">✕ refused</text>
    <line x1="234.0" y1="434.0" x2="234.0" y2="440.0" stroke="#59636e" stroke-width="1.5" stroke-linecap="round"/><path d="M234.0 449.0 L229.6 440.0 L238.4 440.0 Z" fill="#59636e"/>
    <text x="456.0" y="408.0" fill="#59636e" font-size="11" textLength="330.0" lengthAdjust="spacing" xml:space="preserve">Even a name the model invents is turned down here.</text>
    <rect x="44.0" y="452.0" width="380.0" height="40.0" rx="8" fill="#9a6700" fill-opacity="0.1" stroke="#9a6700" stroke-width="1.4"/>
    <text x="58.0" y="477.0" fill="#9a6700" font-size="13" font-weight="600" textLength="7.8" lengthAdjust="spacing" xml:space="preserve">②</text>
    <text x="80.0" y="477.0" fill="#1f2328" font-size="12" textLength="252.0" lengthAdjust="spacing" xml:space="preserve">Approval gate · auto·confirm·strict</text>
    <text x="352.6" y="477.0" fill="#cf222e" font-size="11" textLength="59.4" lengthAdjust="spacing" xml:space="preserve">✕ stopped</text>
    <line x1="234.0" y1="494.0" x2="234.0" y2="500.0" stroke="#59636e" stroke-width="1.5" stroke-linecap="round"/><path d="M234.0 509.0 L229.6 500.0 L238.4 500.0 Z" fill="#59636e"/>
    <text x="456.0" y="468.0" fill="#59636e" font-size="11" textLength="343.2" lengthAdjust="spacing" xml:space="preserve">auto never asks (undo is the net) · confirm asks for</text>
    <text x="456.0" y="483.0" fill="#59636e" font-size="11" textLength="396.0" lengthAdjust="spacing" xml:space="preserve">irreversible commands · strict for every change and command.</text>
    <text x="456.0" y="498.0" fill="#59636e" font-size="11" textLength="257.4" lengthAdjust="spacing" xml:space="preserve">Deny rules block without asking at all.</text>
    <rect x="44.0" y="512.0" width="380.0" height="56.0" rx="9" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.4"/>
    <text x="58.0" y="546.0" fill="#8250df" font-size="15" font-weight="600" textLength="9.0" lengthAdjust="spacing" xml:space="preserve">▣</text>
    <text x="86.0" y="536.0" fill="#1f2328" font-size="12.5" font-weight="600" textLength="97.5" lengthAdjust="spacing" xml:space="preserve">The tool runs</text>
    <text x="86.0" y="554.0" fill="#59636e" font-size="11" textLength="178.2" lengthAdjust="spacing" xml:space="preserve">Read · Grep · Edit · Bash …</text>
    <line x1="234.0" y1="570.0" x2="234.0" y2="576.0" stroke="#59636e" stroke-width="1.5" stroke-linecap="round"/><path d="M234.0 585.0 L229.6 576.0 L238.4 576.0 Z" fill="#59636e"/>
    <text x="456.0" y="528.0" fill="#59636e" font-size="11" textLength="310.2" lengthAdjust="spacing" xml:space="preserve">Every change lands in the undo history (/undo).</text>
    <text x="456.0" y="543.0" fill="#59636e" font-size="11" textLength="316.8" lengthAdjust="spacing" xml:space="preserve">Every tool call is written to .deel/audit.jsonl.</text>
    <text x="456.0" y="558.0" fill="#59636e" font-size="11" textLength="349.8" lengthAdjust="spacing" xml:space="preserve">Results go back to the model, up to the step ceiling.</text>
    <rect x="44.0" y="588.0" width="380.0" height="56.0" rx="9" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.4"/>
    <text x="58.0" y="622.0" fill="#1a7f37" font-size="15" font-weight="600" textLength="9.0" lengthAdjust="spacing" xml:space="preserve">✓</text>
    <text x="86.0" y="612.0" fill="#1f2328" font-size="12.5" font-weight="600" textLength="45.0" lengthAdjust="spacing" xml:space="preserve">Verify</text>
    <text x="86.0" y="630.0" fill="#59636e" font-size="11" textLength="231.0" lengthAdjust="spacing" xml:space="preserve">runs what was built to see it works</text>
    <line x1="234.0" y1="646.0" x2="234.0" y2="652.0" stroke="#59636e" stroke-width="1.5" stroke-linecap="round"/><path d="M234.0 661.0 L229.6 652.0 L238.4 652.0 Z" fill="#59636e"/>
    <text x="456.0" y="604.0" fill="#59636e" font-size="11" textLength="290.4" lengthAdjust="spacing" xml:space="preserve">It does not call done what it did not check.</text>
    <rect x="44.0" y="664.0" width="380.0" height="56.0" rx="9" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.4"/>
    <text x="58.0" y="698.0" fill="#1a7f37" font-size="15" font-weight="600" textLength="9.0" lengthAdjust="spacing" xml:space="preserve">✦</text>
    <text x="86.0" y="688.0" fill="#1f2328" font-size="12.5" font-weight="600" textLength="45.0" lengthAdjust="spacing" xml:space="preserve">Answer</text>
    <text x="86.0" y="706.0" fill="#59636e" font-size="11" textLength="250.8" lengthAdjust="spacing" xml:space="preserve">what changed and why, in a line or two</text>
    <path d="M426.0 540.0 L436.0 540.0 L436.0 344.0 L435.0 344.0" fill="none" stroke="#1b7c83" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round"/><path d="M426.0 344.0 L435.0 339.6 L435.0 348.4 Z" fill="#1b7c83"/>
    <circle cx="436" cy="442.0" r="9" fill="#ffffff" stroke="#1b7c83" stroke-width="1.2"/>
    <text x="432.7" y="446.0" fill="#1b7c83" font-size="11" textLength="6.6" lengthAdjust="spacing" xml:space="preserve">⟳</text>
  </g>
</svg>
