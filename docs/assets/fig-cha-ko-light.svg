    <text x="542.0" y="374.0" fill="#59636e" font-size="10.5" textLength="359.1" lengthAdjust="spacing" xml:space="preserve">한 바퀴가 한 판. 2.0.0 은 이 바퀴를 열다섯 번 돌았습니다.</text>
    <text x="542.0" y="391.0" fill="#59636e" font-size="10.5" textLength="340.2" lengthAdjust="spacing" xml:space="preserve">4번이 「거짓」 이면 반증을 적고 그 자리는 안 고칩니다.</text>
    <text x="542.0" y="408.0" fill="#59636e" font-size="10.5" textLength="296.1" lengthAdjust="spacing" xml:space="preserve">7번에서 검사가 안 빨개지면 6번으로 돌아갑니다 —</text>
    <text x="542.0" y="425.0" fill="#59636e" font-size="10.5" textLength="371.7" lengthAdjust="spacing" xml:space="preserve">초록은 「지킨다」 가 아니라 「안 걸렸다」 일 수 있으니까요.</text>
