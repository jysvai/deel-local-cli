<svg xmlns="http://www.w3.org/2000/svg" width="930" height="522" viewBox="0 0 930 522" role="img" aria-label="deel — CHA — 한 판이 도는 아홉 걸음">
  <title>deel — CHA — 한 판이 도는 아홉 걸음</title>
  <desc>순환형 적대적 하네싱(CHA)의 아홉 걸음이 고리로 놓여 있고, 표시가 한 칸씩 짚으며 되풀이해 돈다. 사냥 · 브리핑 · 2차 눈 · 판정 · 빨간 검사 먼저 · 고침 · 어긋내기 · 관문 · 기록 순이고, 9번 기록에서 다시 1번 사냥으로 돌아간다. 2차 눈 자리에는 세 모델이 선다 — 1차 Claude 는 쓰고, 2차 Gemini 와 3차 codex 는 읽기만 한다. 움직임 줄이기를 켠 화면에서는 첫 칸에 멈춘 채로 보인다.</desc>
