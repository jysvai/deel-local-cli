<svg xmlns="http://www.w3.org/2000/svg" width="900" height="626" viewBox="0 0 900 626" role="img" aria-label="deel — 글이 갈 수 있는 자리">
  <title>deel — 글이 갈 수 있는 자리</title>
  <desc>작업 폴더와 .deel/ 은 이 컴퓨터 안에 있고, 선을 넘는 길은 넷뿐이다 — 모델 게이트웨이 · WebFetch · 플러그인 받기 · MCP 서버. 열쇠와 감사 기록 · 되돌리기 기록 · 대화는 선을 안 넘고, 수집하는 것도 없다. 봉인(deel offline)은 뒤의 셋을 잠그고 모델 주소를 이 PC·사내로만 묶는다.</desc>
  <rect width="900" height="626" rx="10" fill="#0d1117" stroke="#30363d"/>
  <g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace">
    <text x="36.0" y="36.0" fill="#e6edf3" font-size="16" font-weight="600" textLength="192.0" lengthAdjust="spacing" xml:space="preserve">글이 갈 수 있는 자리</text>
    <text x="36.0" y="58.0" fill="#8b949e" font-size="11.5" textLength="441.6" lengthAdjust="spacing" xml:space="preserve">이 컴퓨터 안과 바깥 사이 — 무엇이 선을 넘고, 무엇이 절대 안 넘나</text>
    <rect x="36.0" y="80.0" width="828.0" height="192.0" rx="9" fill="#3fb950" fill-opacity="0.06" stroke="#3fb950" stroke-width="1.4"/>
    <text x="54.0" y="104.0" fill="#3fb950" font-size="13" font-weight="600" textLength="280.8" lengthAdjust="spacing" xml:space="preserve">⌂  이 컴퓨터 안 — 작업 폴더 · .deel/</text>
    <text x="54.0" y="130.0" fill="#8b949e" font-size="11" textLength="79.2" lengthAdjust="spacing" xml:space="preserve">여기 있는 것</text>
    <text x="54.0" y="152.0" fill="#e6edf3" font-size="11.5" textLength="110.4" lengthAdjust="spacing" xml:space="preserve">작업 폴더의 소스</text>
    <text x="54.0" y="172.0" fill="#e6edf3" font-size="11.5" textLength="179.4" lengthAdjust="spacing" xml:space="preserve">.deel/sessions — 대화 기록</text>
    <text x="54.0" y="192.0" fill="#e6edf3" font-size="11.5" textLength="165.6" lengthAdjust="spacing" xml:space="preserve">.deel/history — 되돌리기</text>
    <text x="54.0" y="212.0" fill="#e6edf3" font-size="11.5" textLength="200.1" lengthAdjust="spacing" xml:space="preserve">.deel/audit.jsonl — 감사 기록</text>
    <text x="54.0" y="232.0" fill="#e6edf3" font-size="11.5" textLength="151.8" lengthAdjust="spacing" xml:space="preserve">.deel/memory.md — 기억</text>
    <text x="54.0" y="252.0" fill="#e6edf3" font-size="11.5" textLength="241.5" lengthAdjust="spacing" xml:space="preserve">config.json — 열쇠 (DPAPI · 키체인)</text>
    <text x="470.0" y="130.0" fill="#ff7b72" font-size="11" font-weight="600" textLength="138.6" lengthAdjust="spacing" xml:space="preserve">⊘  이 선을 안 넘는 것</text>
    <text x="470.0" y="156.0" fill="#e6edf3" font-size="11.5" textLength="338.1" lengthAdjust="spacing" xml:space="preserve">열쇠 — 붙은 그 주소 인증에만. 말·화면·기록엔 가림</text>
    <text x="470.0" y="178.0" fill="#e6edf3" font-size="11.5" textLength="296.7" lengthAdjust="spacing" xml:space="preserve">감사 기록 · 되돌리기 · 대화 — .deel/ 안에만</text>
    <text x="470.0" y="200.0" fill="#e6edf3" font-size="11.5" textLength="282.9" lengthAdjust="spacing" xml:space="preserve">텔레메트리 · 사용 통계 · 오류 보고 — 없음</text>
    <line x1="135.0" y1="284.0" x2="135.0" y2="391.0" stroke="#58a6ff" stroke-width="1.6" stroke-linecap="round"/><path d="M135.0 400.0 L130.6 391.0 L139.4 391.0 Z" fill="#58a6ff"/>
    <circle cx="135.0" cy="334" r="11" fill="#0d1117" stroke="#3fb950" stroke-width="1.6"/>
    <text x="131.7" y="338.0" fill="#3fb950" font-size="11" textLength="6.6" lengthAdjust="spacing" xml:space="preserve">⌂</text>
    <rect x="36.0" y="408.0" width="198.0" height="118.0" rx="9" fill="#161b22" stroke="#30363d" stroke-width="1.4"/>
    <text x="50.0" y="430.0" fill="#58a6ff" font-size="12" font-weight="600" textLength="21.6" lengthAdjust="spacing" xml:space="preserve">[A]</text>
    <text x="80.0" y="430.0" fill="#e6edf3" font-size="12" font-weight="600" textLength="108.0" lengthAdjust="spacing" xml:space="preserve">모델 게이트웨이</text>
    <text x="50.0" y="454.0" fill="#8b949e" font-size="10.5" textLength="119.7" lengthAdjust="spacing" xml:space="preserve">시킨 말 · 읽은 조각</text>
    <text x="50.0" y="471.0" fill="#8b949e" font-size="10.5" textLength="88.2" lengthAdjust="spacing" xml:space="preserve">도구 결과 · 답</text>
    <text x="50.0" y="488.0" fill="#8b949e" font-size="10.5" textLength="119.7" lengthAdjust="spacing" xml:space="preserve">setup 의 주소 한 곳</text>
    <line x1="345.0" y1="284.0" x2="345.0" y2="391.0" stroke="#58a6ff" stroke-width="1.6" stroke-linecap="round"/><path d="M345.0 400.0 L340.6 391.0 L349.4 391.0 Z" fill="#58a6ff"/>
    <circle cx="345.0" cy="334" r="11" fill="#0d1117" stroke="#ff7b72" stroke-width="1.6"/>
    <text x="341.7" y="338.0" fill="#ff7b72" font-size="11" textLength="6.6" lengthAdjust="spacing" xml:space="preserve">⛊</text>
    <rect x="246.0" y="408.0" width="198.0" height="118.0" rx="9" fill="#161b22" stroke="#30363d" stroke-width="1.4"/>
    <text x="260.0" y="430.0" fill="#58a6ff" font-size="12" font-weight="600" textLength="21.6" lengthAdjust="spacing" xml:space="preserve">[B]</text>
    <text x="290.0" y="430.0" fill="#e6edf3" font-size="12" font-weight="600" textLength="57.6" lengthAdjust="spacing" xml:space="preserve">WebFetch</text>
    <text x="260.0" y="454.0" fill="#8b949e" font-size="10.5" textLength="75.6" lengthAdjust="spacing" xml:space="preserve">받기만 — GET</text>
    <text x="260.0" y="471.0" fill="#8b949e" font-size="10.5" textLength="63.0" lengthAdjust="spacing" xml:space="preserve">몸 0바이트</text>
    <text x="260.0" y="488.0" fill="#8b949e" font-size="10.5" textLength="113.4" lengthAdjust="spacing" xml:space="preserve">사설 · 루프백 거절</text>
    <line x1="555.0" y1="284.0" x2="555.0" y2="391.0" stroke="#58a6ff" stroke-width="1.6" stroke-linecap="round"/><path d="M555.0 400.0 L550.6 391.0 L559.4 391.0 Z" fill="#58a6ff"/>
    <circle cx="555.0" cy="334" r="11" fill="#0d1117" stroke="#ff7b72" stroke-width="1.6"/>
    <text x="551.7" y="338.0" fill="#ff7b72" font-size="11" textLength="6.6" lengthAdjust="spacing" xml:space="preserve">⛊</text>
    <rect x="456.0" y="408.0" width="198.0" height="118.0" rx="9" fill="#161b22" stroke="#30363d" stroke-width="1.4"/>
    <text x="470.0" y="430.0" fill="#58a6ff" font-size="12" font-weight="600" textLength="21.6" lengthAdjust="spacing" xml:space="preserve">[C]</text>
    <text x="500.0" y="430.0" fill="#e6edf3" font-size="12" font-weight="600" textLength="93.6" lengthAdjust="spacing" xml:space="preserve">플러그인 받기</text>
    <text x="470.0" y="454.0" fill="#8b949e" font-size="10.5" textLength="94.5" lengthAdjust="spacing" xml:space="preserve">/plugin install</text>
    <text x="470.0" y="471.0" fill="#8b949e" font-size="10.5" textLength="69.3" lengthAdjust="spacing" xml:space="preserve">도는 동안만</text>
    <line x1="765.0" y1="284.0" x2="765.0" y2="391.0" stroke="#58a6ff" stroke-width="1.6" stroke-linecap="round"/><path d="M765.0 400.0 L760.6 391.0 L769.4 391.0 Z" fill="#58a6ff"/>
    <circle cx="765.0" cy="334" r="11" fill="#0d1117" stroke="#ff7b72" stroke-width="1.6"/>
    <text x="761.7" y="338.0" fill="#ff7b72" font-size="11" textLength="6.6" lengthAdjust="spacing" xml:space="preserve">⛊</text>
    <rect x="666.0" y="408.0" width="198.0" height="118.0" rx="9" fill="#161b22" stroke="#30363d" stroke-width="1.4"/>
    <text x="680.0" y="430.0" fill="#58a6ff" font-size="12" font-weight="600" textLength="21.6" lengthAdjust="spacing" xml:space="preserve">[D]</text>
    <text x="710.0" y="430.0" fill="#e6edf3" font-size="12" font-weight="600" textLength="57.6" lengthAdjust="spacing" xml:space="preserve">MCP 서버</text>
    <text x="680.0" y="454.0" fill="#8b949e" font-size="10.5" textLength="81.9" lengthAdjust="spacing" xml:space="preserve">남의 프로세스</text>
    <text x="680.0" y="471.0" fill="#8b949e" font-size="10.5" textLength="88.2" lengthAdjust="spacing" xml:space="preserve">밖에서 못 본다</text>
    <text x="680.0" y="488.0" fill="#8b949e" font-size="10.5" textLength="113.4" lengthAdjust="spacing" xml:space="preserve">mcp.json 에 적어야</text>
    <line x1="36" y1="334" x2="864" y2="334" stroke="#3fb950" stroke-width="2.5" stroke-linecap="round"/>
    <text x="36.0" y="324.0" fill="#3fb950" font-size="10.5" textLength="189.0" lengthAdjust="spacing" xml:space="preserve">경계 — 위는 이 PC, 아래는 바깥</text>
    <rect x="36.0" y="544.0" width="828.0" height="58.0" rx="9" fill="#ff7b72" fill-opacity="0.06" stroke="#ff7b72" stroke-width="1.4" stroke-dasharray="5 4"/>
    <text x="54.0" y="566.0" fill="#e6edf3" font-size="11.5" font-weight="600" textLength="496.8" lengthAdjust="spacing" xml:space="preserve">⛊  봉인 (deel offline) — B · C · D 를 잠근다. MCP 서버는 아예 안 띄운다.</text>
    <text x="54.0" y="586.0" fill="#8b949e" font-size="11.5" textLength="731.4" lengthAdjust="spacing" xml:space="preserve">A 는 이 PC · 사내 주소만 (127.x · 10.x · 192.168.x · 172.16-31.x). ⌂ 는 바깥이면 물어보고, ↗ 는 안 묻는다.</text>
  </g>
</svg>
